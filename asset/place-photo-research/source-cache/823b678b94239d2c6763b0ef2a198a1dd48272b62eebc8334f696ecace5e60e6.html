<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, noarchive, nofollow" />
<title>Hệ thống đang được nâng cấp</title>
<!--
  TRANG "ĐANG NÂNG CẤP" — DÙNG CHO CẢ HAI TẦNG (soạn 2026-08-13 theo yêu cầu của user):

  ① TẦNG IIS (quan trọng nhất): khi ứng dụng KHÔNG khởi động được thì mã lỗi do
     AspNetCoreModule sinh ra (500.30 / 500.35 / 502.5 …) và mọi xử lý bên trong ứng dụng
     đều VÔ HIỆU — vì ứng dụng chưa hề chạy. `web.config` khai tệp TĨNH này qua
     <httpErrors … responseMode="File"> nên IIS đọc thẳng từ đĩa, không cần app.
     👉 Vì vậy tệp phải TỰ CHỨA TUYỆT ĐỐI: không link CSS/JS/ảnh/phông chữ bên ngoài
     (những thứ đó cũng do app phục vụ — app chết là hỏng nốt).

  ② TẦNG ỨNG DỤNG: khi app CÓ chạy nhưng trang chủ ném lỗi, `Support/QiLoiTrang.cs` đọc
     đúng tệp này và trả về ⇒ hai tầng cùng một hình thức, sửa một chỗ là đổi cả hai.

  Tự tải lại sau 60 giây để khách đang chờ tự thấy trang khi hệ thống hồi phục.
-->
<meta http-equiv="refresh" content="60" />
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: #1f2a37;
        background: #eef3fb;
        background: linear-gradient(160deg, #eef3fb 0%, #e3ecf9 55%, #dfe9f7 100%);
    }

    .khung {
        width: 100%;
        max-width: 560px;
        background: #fff;
        border-radius: 16px;
        padding: 40px 32px 32px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(19, 47, 92, .12);
    }

    .bieutuong {
        width: 84px;
        height: 84px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e8f0fe;
        color: #1c64d4;
    }

    .bieutuong svg { width: 44px; height: 44px; display: block; }

    h1 {
        margin: 0 0 12px;
        font-size: 25px;
        line-height: 1.3;
        font-weight: 700;
        color: #14315e;
    }

    p {
        margin: 0 0 10px;
        font-size: 16px;
        line-height: 1.6;
        color: #475467;
    }

    .nut {
        display: inline-block;
        margin-top: 20px;
        padding: 11px 26px;
        border: 0;
        border-radius: 8px;
        background: #1c64d4;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
    }

    .nut:hover { background: #174fa8; }

    .chandong {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #eaecf0;
        font-size: 13px;
        color: #98a2b3;
    }

    @media (max-width: 420px) {
        .khung { padding: 28px 20px 24px; }
        h1 { font-size: 21px; }
        p { font-size: 15px; }
    }
</style>
</head>
<body>
    <main class="khung">
        <div class="bieutuong" aria-hidden="true">
            <!-- bánh răng: dấu hiệu quen thuộc của "đang bảo trì / nâng cấp" -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3.2" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
        </div>

        <h1>Hệ thống đang được nâng cấp</h1>
        <p>Website tạm thời gián đoạn để nâng cấp, bảo trì.</p>
        <p>Xin quý vị vui lòng quay lại sau ít phút. Trân trọng cáo lỗi vì sự bất tiện này.</p>

        <a class="nut" href="/">Thử lại</a>

        <div class="chandong">Trang sẽ tự động tải lại sau ít phút.</div>
    </main>
</body>
</html>
