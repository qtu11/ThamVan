	<script>
	(function () {
		var config = window.CUSTOMER_SOCIAL_CAPTURE_CONFIG || {};
		var idPath = window.id_path || '';
		if (!config.enabled || !idPath || typeof localStorage === 'undefined') {
			return;
		}

		var globalStorageKey = 'sg3d_customer_identity_completed_global';
		var storageKey = 'sg3d_customer_identity_completed_' + idPath;
		if (localStorage.getItem(globalStorageKey) || localStorage.getItem(storageKey)) {
			return;
		}

		var overlay = document.getElementById('sg-capture-overlay');
		var policyModal = document.getElementById('sg-policy-modal');
		var policyIframe = document.getElementById('sg-policy-iframe');
		var form = document.getElementById('sg-capture-form');
		var submitBtn = document.getElementById('sg-capture-submit');
		var msgEl = document.getElementById('sg-capture-message');
		var nameEl = document.getElementById('sg-input-name');
		var emailEl = document.getElementById('sg-input-email');
		var phoneEl = document.getElementById('sg-input-phone');
		var consentEl = document.getElementById('sg-consent-checkbox');

		if (!overlay || !form || !submitBtn || !msgEl || !nameEl || !emailEl || !phoneEl || !consentEl) {
			return;
		}

		var googleBtn = document.getElementById('sg-btn-google');
		var appleBtn = document.getElementById('sg-btn-apple');
		var microsoftBtn = document.getElementById('sg-btn-microsoft');
		var policyOpenBtn = document.getElementById('sg-open-policy');
		var policyCloseX = document.getElementById('sg-policy-close-x');
		var policyCloseBtn = document.getElementById('sg-policy-close-btn');

		var loading = false;
		var googleInitialized = false;
		var msalClient = null;

		function setMessage(text, type) {
			msgEl.className = '';
			msgEl.id = 'sg-capture-message';
			if (type === 'error') {
				msgEl.classList.add('error');
			}
			if (type === 'success') {
				msgEl.classList.add('success');
			}
			msgEl.textContent = text || '';
		}

		function setLoadingState(value) {
			loading = value;
			submitBtn.disabled = value;
			if (googleBtn) googleBtn.disabled = value;
			if (appleBtn) appleBtn.disabled = value;
			if (microsoftBtn) microsoftBtn.disabled = value;
			submitBtn.textContent = value ? 'Đang xử lý...' : 'Tiếp tục truy cập';
		}

		function toBool(value) {
			if (typeof value === 'boolean') return value;
			if (typeof value === 'number') return value === 1;
			if (typeof value === 'string') {
				var normalized = value.trim().toLowerCase();
				return normalized === '1' || normalized === 'true';
			}
			if (value && typeof value === 'object') {
				if (Object.prototype.hasOwnProperty.call(value, 'for_user')) {
					return Number(value.for_user) === 1;
				}
				if (Object.prototype.hasOwnProperty.call(value, 'active')) {
					return Number(value.active) === 1;
				}
			}
			return false;
		}

		function isFeatureEnabled() {
			if (typeof window.activeModules === 'object' && window.activeModules !== null && Object.prototype.hasOwnProperty.call(window.activeModules, 'customerIdentityCapture')) {
				return toBool(window.activeModules.customerIdentityCapture);
			}
			return true;
		}

		function loadScript(id, src) {
			return new Promise(function (resolve, reject) {
				var existing = document.getElementById(id);
				if (existing) {
					if (existing.getAttribute('data-loaded') === 'true') {
						resolve();
						return;
					}
					existing.addEventListener('load', function onLoad() {
						existing.setAttribute('data-loaded', 'true');
						existing.removeEventListener('load', onLoad);
						resolve();
					});
					existing.addEventListener('error', function onError() {
						existing.removeEventListener('error', onError);
						reject(new Error('Failed loading script: ' + src));
					});
					return;
				}
				var script = document.createElement('script');
				script.id = id;
				script.src = src;
				script.async = true;
				script.onload = function () {
					script.setAttribute('data-loaded', 'true');
					resolve();
				};
				script.onerror = function () {
					reject(new Error('Failed loading script: ' + src));
				};
				document.head.appendChild(script);
			});
		}

		function parseJwt(token) {
			if (!token || token.split('.').length < 2) return null;
			try {
				var payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
				return JSON.parse(atob(payload));
			} catch (_error) {
				return null;
			}
		}

		function getBrowserMeta() {
			var ua = navigator.userAgent || '';
			var lower = ua.toLowerCase();
			var browser = 'unknown';
			var platform = 'unknown';

			if (lower.indexOf('edg/') >= 0) browser = 'edge';
			else if (lower.indexOf('chrome') >= 0) browser = 'chrome';
			else if (lower.indexOf('safari') >= 0) browser = 'safari';
			else if (lower.indexOf('firefox') >= 0) browser = 'firefox';

			if (lower.indexOf('windows') >= 0) platform = 'windows';
			else if (lower.indexOf('mac') >= 0) platform = 'macos';
			else if (lower.indexOf('iphone') >= 0 || lower.indexOf('ipad') >= 0) platform = 'ios';
			else if (lower.indexOf('android') >= 0) platform = 'android';

			return { browser: browser, platform: platform, userAgent: ua };
		}

		function markCompleted() {
			localStorage.setItem(globalStorageKey, '1');
			localStorage.setItem(storageKey, '1');
			overlay.classList.add('sg-capture-hidden');
			try {
				if (window.google && window.google.accounts && window.google.accounts.id) {
					window.google.accounts.id.cancel();
				}
			} catch (_error) {
				// No-op.
			}
		}

		async function submitCapture(provider, payload) {
			if (loading) return;

			setLoadingState(true);
			setMessage('Đang lưu thông tin...', 'success');

			try {
				var meta = getBrowserMeta();
				var endpoint = (config.apiBaseUrl || '').replace(/\/+$/, '') + '/v1/projects/customers/capture?id_path=' + encodeURIComponent(idPath);

				var headers = { 'Content-Type': 'application/json' };
				if (config.apiKey) {
					headers['x-api-key'] = config.apiKey;
				}

				var response = await fetch(endpoint, {
					method: 'POST',
					headers: headers,
					body: JSON.stringify(Object.assign({
						provider: provider,
						browser: meta.browser,
						platform: meta.platform,
						userAgent: meta.userAgent,
						sourcePage: window.location.href
					}, payload || {}))
				});

				var data = await response.json();
				if (response.ok && data && data.success) {
					setMessage('Cảm ơn! Đã lưu thông tin thành công.', 'success');
					markCompleted();
					return;
				}

				setMessage((data && data.message) ? data.message : 'Không thể lưu thông tin.', 'error');
			} catch (_error) {
				setMessage('Có lỗi xảy ra khi lưu thông tin.', 'error');
			} finally {
				setLoadingState(false);
			}
		}

		async function initGoogleOneTap() {
			if (!config.googleClientId) return;
			try {
				await loadScript('sg-google-one-tap-sdk', 'https://accounts.google.com/gsi/client');
				if (!window.google || !window.google.accounts || !window.google.accounts.id) return;

				if (!googleInitialized) {
					window.google.accounts.id.initialize({
						client_id: config.googleClientId,
						auto_select: false,
						cancel_on_tap_outside: true,
						callback: function (result) {
							var profile = parseJwt(result && result.credential);
							submitCapture('google', {
								idToken: result && result.credential,
								user: {
									providerUserId: profile && profile.sub,
									email: profile && profile.email,
									name: profile && profile.name,
									given_name: profile && profile.given_name,
									family_name: profile && profile.family_name,
									picture: profile && profile.picture,
									locale: profile && profile.locale
								}
							});
						}
					});
					googleInitialized = true;
				}

				window.google.accounts.id.prompt();
			} catch (_error) {
				// Keep silent.
			}
		}

		async function handleAppleSignIn() {
			if (!config.appleClientId) {
				setMessage('Thiếu cấu hình Apple Client ID.', 'error');
				return;
			}

			try {
				await loadScript('sg-apple-signin-sdk', 'https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js');
				if (!window.AppleID || !window.AppleID.auth) {
					setMessage('Không thể tải Apple Sign In SDK.', 'error');
					return;
				}

				window.AppleID.auth.init({
					clientId: config.appleClientId,
					scope: 'name email',
					redirectURI: config.appleRedirectUri || window.location.origin,
					usePopup: true,
					state: String(Date.now())
				});

				var result = await window.AppleID.auth.signIn({ usePopup: true });
				var idToken = result && result.authorization && result.authorization.id_token;
				var tokenPayload = parseJwt(idToken);
				var user = (result && result.user) || {};

				submitCapture('apple', {
					idToken: idToken,
					user: {
						providerUserId: (tokenPayload && tokenPayload.sub) || user.sub,
						email: user.email,
						fullName: user.name ? ((user.name.firstName || '') + ' ' + (user.name.lastName || '')).trim() : '',
						firstName: user.name && user.name.firstName,
						lastName: user.name && user.name.lastName
					}
				});
			} catch (_error) {
				setMessage('Đăng nhập Apple chưa thành công.', 'error');
			}
		}

		async function handleMicrosoftSignIn() {
			if (!config.microsoftClientId) {
				setMessage('Thiếu cấu hình Microsoft Client ID.', 'error');
				return;
			}

			try {
				await loadScript('sg-msal-browser-sdk', 'https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js');
				if (!window.msal || !window.msal.PublicClientApplication) {
					setMessage('Không thể tải Microsoft SDK.', 'error');
					return;
				}

				if (!msalClient) {
					msalClient = new window.msal.PublicClientApplication({
						auth: {
							clientId: config.microsoftClientId,
							authority: 'https://login.microsoftonline.com/' + (config.microsoftTenantId || 'common'),
							redirectUri: window.location.origin
						}
					});
				}

				var loginResult = await msalClient.loginPopup({
					scopes: ['openid', 'profile', 'email'],
					prompt: 'select_account',
					redirectUri: window.location.origin,
					popupWindowAttributes: {
						popupSize: { width: 520, height: 640 },
						popupPosition: {
							top: 80,
							left: Math.max(0, Math.round((window.screen.width - 520) / 2))
						}
					}
				});

				submitCapture('microsoft', {
					idToken: loginResult && loginResult.idToken,
					user: {
						providerUserId: loginResult && loginResult.account && loginResult.account.localAccountId,
						email: loginResult && loginResult.account && loginResult.account.username,
						name: loginResult && loginResult.account && loginResult.account.name,
						tenantId: loginResult && loginResult.account && loginResult.account.tenantId
					}
				});
			} catch (_error) {
				setMessage('Đăng nhập Microsoft chưa thành công.', 'error');
			}
		}

		function openPolicy(event) {
			if (event) event.preventDefault();
			if (!policyModal) return;
			if (policyIframe) {
				policyIframe.src = config.policyUrl || 'https://starglobal3d.com/policy/dieu-khoan-va-dieu-kien-su-dung/';

			if (!policyModal) return;

		form.addEventListener('submit', function (event) {
			event.preventDefault();
			if (loading) return;

			var fullName = String(nameEl.value || '').trim();
			var email = String(emailEl.value || '').trim();
			var phone = String(phoneEl.value || '').trim();

			if (!consentEl.checked) {
				setMessage('Vui lòng đồng ý với Chính sách bảo mật dữ liệu.', 'error');
				return;
			}

			if (!fullName || !email || !phone) {
				setMessage('Vui lòng nhập đầy đủ Họ tên, Email và Số điện thoại.', 'error');
				return;
			}

			submitCapture('quick_form', {
				fullName: fullName,
				email: email,
				phone: phone
			});
		});

		if (googleBtn) {
			googleBtn.addEventListener('click', function () {
				if (window.google && window.google.accounts && window.google.accounts.id) {
					window.google.accounts.id.prompt();
					return;
				}
				initGoogleOneTap();
			});
		}
		if (appleBtn) {
			appleBtn.addEventListener('click', function () { handleAppleSignIn(); });
		}
		if (microsoftBtn) {
			microsoftBtn.addEventListener('click', function () { handleMicrosoftSignIn(); });
		}
		if (policyOpenBtn) {
			policyOpenBtn.addEventListener('click', openPolicy);
		}
		if (policyCloseX) {
			policyCloseX.addEventListener('click', closePolicy);
		}
		if (policyCloseBtn) {
			policyCloseBtn.addEventListener('click', closePolicy);
		}
		consentEl.addEventListener('change', function () {
			if (consentEl.checked) {
				setMessage('', 'success');
			}
		});
		if (policyModal) {
			policyModal.addEventListener('click', closePolicy);
			var policyCard = document.getElementById('sg-policy-card');
			if (policyCard) {
				policyCard.addEventListener('click', function (event) {
					event.stopPropagation();
				});
			}
		}

		if (!isFeatureEnabled()) {
			return;
		}

		window.setTimeout(function () {
			overlay.classList.remove('sg-capture-hidden');
			initGoogleOneTap();
		}, 60000);
	})();
	</script>
</body>
</html>
